# Native Hermes dashboard + Telegram, designed for Render Free (512 MB).
services:
  - type: web
    name: hermes
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: GIT_STATE_REPO
        value: Sugamdeol/hermes-storage
      - key: GIT_STATE_BRANCH
        value: state
      - key: GIT_STATE_TOKEN
        sync: false
      - key: STORAGE_ENCRYPTION_KEY
        generateValue: true
      - key: HERMES_GATEWAY_TOKEN
        generateValue: true
      - key: GIT_STATE_ENV_MODE
        value: encrypt
      - key: GIT_STATE_HTTP_POST_BUFFER_MB
        value: "32"
      - key: GIT_STATE_WATCH_SECONDS
        value: "10"
      - key: GIT_STATE_DEBOUNCE_SECONDS
        value: "10"
      - key: GIT_STATE_MIN_PUSH_INTERVAL_SECONDS
        value: "30"
      - key: GIT_STATE_MAX_COMMITS
        value: "200"
      - key: HERMES_FAILOVER
        value: "0"
      - key: HERMES_HOME
        value: /opt/data
      - key: PORT
        value: "10000"
      - key: HERMES_DASHBOARD_HOST
        value: 127.0.0.1
      - key: HERMES_DASHBOARD_PORT
        value: "9119"
      - key: HERMES_DASHBOARD_TUI
        value: "1"
      - key: HERMES_CRON_MAX_PARALLEL
        value: "1"
      - key: HERMES_TUI_RPC_POOL_WORKERS
        value: "2"
      - key: HERMES_AGENT_CACHE_MAX_SIZE
        value: "1"
      - key: HERMES_AGENT_CACHE_IDLE_TTL_SECONDS
        value: "30"
      - key: MALLOC_ARENA_MAX
        value: "1"
