# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Hermes Agent on Render, pre-baked with Render tools.
# https://github.com/NousResearch/hermes-agent
#
# Single web service built from the local Dockerfile, which extends the
# upstream Hermes image with:
#   - The official render-oss/skills bundle, pinned at a commit
#   - The Render MCP server pre-registered in config.yaml at boot
#     with the full MCP tool catalog available to the provided API key
#   - A dashboard plugin ("Custom API providers" card on the Models page)
#     for adding new API providers from the web UI instead of editing
#     config.yaml by hand
#
# Inside the container the gateway runs in the foreground and the
# dashboard runs as a background side-process (HERMES_DASHBOARD=1).
# Render's public URL serves the dashboard on port 10000. This Blueprint
# deliberately uses the Free instance type, so /opt/data is ephemeral;
# provider keys must be supplied as Render environment variables.
#
# To upgrade Hermes: bump HERMES_IMAGE in the Dockerfile and redeploy.
# To upgrade Render skills: bump RENDER_SKILLS_REF and redeploy.

services:
  - type: web
    name: hermes
    runtime: docker
    region: oregon
    # Free web services have an ephemeral filesystem and spin down after
    # inactivity, but are enough for a personal/demo Hermes deployment.
    # Do not add a disk here: Render does not allow persistent disks on Free.
    plan: free
    # Render builds the image from this repo's Dockerfile on every deploy.
    # The Dockerfile FROMs the pinned upstream Hermes image, adds Render
    # tooling + the skill bundle, and sets ENTRYPOINT to our bootstrap wrapper — so
    # no `dockerCommand` override is needed here.
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    # NOT /api/status. That endpoint re-parses config.yaml, loads the gateway
    # config and opens SQLite to count recent sessions -- measured at
    # 180-700 ms per call on a 0.1 CPU container, on a path the platform polls
    # on its own cadence. The plugin's /health answers the only question a
    # health check asks ("is the process alive") without touching any of it.
    healthCheckPath: /api/plugins/hermes-chat-dashboard/health

    envVars:
      # Free instances lose /opt/data when they spin down or redeploy. Keep
      # secrets in Render environment variables as the durable fallback. When
      # git state sync is enabled, dashboard-managed .env settings are restored
      # too, but the private state repo must then be treated as sensitive.
      - key: HERMES_HOME
        value: /opt/data
      - key: PORT
        value: "10000"

      # Bynara's OpenAI-compatible free router. When this key is present,
      # the boot patcher adds custom:bynara and selects qwen-3.8-max-free
      # unless an explicit model/provider is already configured.
      - key: BYNARA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        sync: false

      # OpenRouter is an alternative provider. Leave this blank if you use
      # Bynara or another provider and add that provider's key in the Render
      # Environment tab instead. sync: false keeps the value out of the
      # Blueprint repository and prompts for it during deploy.
      - key: OPENROUTER_API_KEY
        sync: false

      # State backup: a private GitHub repository. Each save pushes only the
      # bytes that changed (typically a few KB) instead of a whole archive,
      # which is what keeps this inside a small monthly transfer allowance.
      # Leave GIT_STATE_REPO blank to run with disposable local state.
      #
      # On a first launch the state branch is empty, so this instance's tree
      # is seeded to it after the gateway is up; from then on this repo is the
      # source of truth and every boot restores from it.
      #
      # GIT_STATE_TOKEN wants a fine-grained personal access token scoped to
      # that one repository with Contents: read and write. The backend refuses
      # to push unless the GitHub API confirms the repo is private, because
      # /opt/data holds .env, chat history and memories.
      - key: GIT_STATE_REPO
        sync: false
      - key: GIT_STATE_TOKEN
        sync: false
      - key: GIT_STATE_BRANCH
        value: state
      # Saves are change-driven: the tree is fingerprinted every
      # GIT_STATE_WATCH_SECONDS and pushed once it has been quiet for
      # GIT_STATE_DEBOUNCE_SECONDS, so a change reaches GitHub within seconds.
      # GIT_STATE_MIN_PUSH_INTERVAL_SECONDS is the hard floor between two
      # pushes; GIT_STATE_INTERVAL_SECONDS is only the safety net for a change
      # the fingerprint might miss. GIT_STATE_WATCH=0 disables the watcher.
      - key: GIT_STATE_WATCH
        value: "1"
      # Deliberately slower than the old 5s/10s/20s. Every tick walks the whole
      # state tree to fingerprint it (measured: ~11 ms per scan on a 600-file
      # tree, and it grows with the tree), and every push forks git. On 0.1 CPU
      # that background work competes directly with the chat that is actually
      # being paid for. 15s/20s/60s still lands a change in GitHub inside about
      # a minute -- close enough to "immediately" to be a real backup, and a
      # fifth of the CPU churn.
      - key: GIT_STATE_WATCH_SECONDS
        value: "15"
      - key: GIT_STATE_DEBOUNCE_SECONDS
        value: "20"
      - key: GIT_STATE_MIN_PUSH_INTERVAL_SECONDS
        value: "60"
      # The safety net for a change the fingerprint might miss. 15 minutes is
      # plenty for a net; the change watcher is what normally triggers a push.
      - key: GIT_STATE_INTERVAL_SECONDS
        value: "900"
      # git mmaps any blob up to core.bigFileThreshold (512 MB by default) in
      # order to hash and delta-compress it, so one changed file costs resident
      # memory equal to its own size. Measured on a 146 MB sessions.db:
      # `git add -A` peaked at 152.0 MB with the default and 9.1 MB with the
      # threshold at 1 MB, because a "big" blob is streamed and stored
      # undeltified instead. This single setting is the difference between the
      # state sync fitting in the leftover budget and it eating a third of the
      # container by itself.
      - key: GIT_STATE_BIG_FILE_THRESHOLD_KB
        value: "1024"
      # Stand the backup down above this share of the container's memory cap.
      # A push is the only routine operation that allocates in a hurry, so it
      # must lose every contest with the conversation in progress. 0 disables.
      - key: GIT_STATE_MAX_MEMORY_PCT
        value: "80"
      # History is squashed to a single commit after this many state commits,
      # so the repository cannot grow without bound.
      - key: GIT_STATE_MAX_COMMITS
        value: "200"
      # A failed state restore at boot (a transient GitHub blip) is retried
      # this many times while boot time allows, because one failure otherwise
      # disarms state sync until the next restart.
      # One attempt, not two: everything before the port bind is inside
      # Render's port-scan window, and a restore allowed to run for
      # HERMES_RESTORE_TIMEOUT_SECONDS x attempts is a deploy that fails with
      # "Port scan timeout reached, no open ports detected" -- losing the
      # restored state AND the deploy. A restore that does not finish is
      # retried by the next boot.
      - key: HERMES_RESTORE_ATTEMPTS
        value: "1"
      - key: HERMES_RESTORE_TIMEOUT_SECONDS
        value: "90"
      # age public key. If set, /opt/data/.env is encrypted to it before being
      # committed. If unset, .env is simply left out of the backup -- it is
      # never committed in the clear.
      - key: GIT_STATE_AGE_RECIPIENT
        sync: false

      # Failover. With HERMES_FAILOVER=1 and a shared state backend (the git
      # repo when configured), the highest-priority instance holding a fresh
      # lease handles chat; the others keep their dashboard but have their
      # chat tokens stripped at boot and never upload state. Leave this
      # service at the lower priority so a laptop started with
      # `run-local.sh --takeover` wins, and this one resumes automatically
      # once the laptop stops and flushes its state.
      # Failover. OFF by default: with one instance there is nothing to fail
      # over to, and the lease costs real resources -- the daemon has to renew
      # it by asking GitHub for every lease ref. That used to happen on every
      # watch tick: a `git ls-remote` (a full TLS handshake, ~190 ms of CPU and
      # ~25 MB of child RSS, measured) every 5 seconds forever, i.e. close to
      # 40% of this container's entire 0.1 CPU budget spent on coordination.
      # The renewal is now on the heartbeat cadence instead of the watch tick,
      # which is a 24x reduction, but on a single-instance Free service the
      # honest answer is still that it buys nothing.
      #
      # Set to "1" ONLY when a second instance (typically a laptop started with
      # `run-local.sh --takeover`) shares GIT_STATE_REPO: the highest-priority
      # instance holding a fresh lease handles chat and the others keep their
      # dashboard with their chat tokens stripped at boot.
      - key: HERMES_FAILOVER
        value: "0"
      - key: HERMES_INSTANCE_ID
        value: render
      - key: HERMES_INSTANCE_PRIORITY
        value: "50"

      # Keep-alive. Render Free spins a service down after ~15 minutes
      # without inbound HTTP traffic, and chat platforms are outbound-only —
      # so without help the container sleeps mid-conversation and the agent
      # stops answering. When RENDER_EXTERNAL_URL is set (Render injects it
      # on every web service), bootstrap starts a tiny loop that requests the
      # dashboard's /api/status over the public URL on the cadence below,
      # which counts as traffic and keeps the service awake. Set to 0 to let
      # the service sleep instead (saves Free instance hours; the next
      # message then waits out a cold start).
      - key: HERMES_KEEP_ALIVE
        value: "1"
      - key: HERMES_KEEP_ALIVE_SECONDS
        value: "600"
      # The path the keep-alive loop requests. The cheap plugin /health, for
      # the same reason the health check uses it: /api/status costs 180-700 ms
      # of this container's CPU per call and answers nothing the ping needs.
      - key: HERMES_KEEP_ALIVE_PATH
        value: /api/plugins/hermes-chat-dashboard/health

      # Shutdown flush. When the service stops or redeploys, the container
      # stays up this many seconds after the gateway exits so the sync
      # daemon can land its final state push instead of being killed
      # mid-flight. Keep this below Render's stop grace period (30s by
      # default) or Render will SIGKILL the container first.
      - key: HERMES_SHUTDOWN_FLUSH_SECONDS
        value: "20"

      # Dashboard side-process. The entrypoint backgrounds `hermes dashboard`
      # before exec'ing `gateway run` whenever HERMES_DASHBOARD is truthy.
      # HERMES_DASHBOARD_HOST=0.0.0.0 makes the entrypoint pass --insecure
      # so the dashboard accepts non-loopback binds.
      - key: HERMES_DASHBOARD
        value: "1"
      - key: HERMES_DASHBOARD_HOST
        value: "0.0.0.0"
      - key: HERMES_DASHBOARD_PORT
        value: "10000"
      # Upstream gates the in-browser Chat tab's WebSocket (/api/ws, the
      # pure-Python tui_gateway JSON-RPC surface the bundled
      # hermes-chat-dashboard plugin drives) behind the same flag as the
      # terminal-PTY fallback (/api/pty). With it off the Chat tab never
      # renders and the WebSocket answers 4403. The heavy Node/esbuild PTY
      # process is only spawned if a client actually connects to /api/pty,
      # which the plugin never does, so enabling chat stays cheap on Free.
      - key: HERMES_DASHBOARD_TUI
        value: "1"
      # Each dashboard chat session otherwise spawns a second full Python
      # interpreter (tui_gateway.slash_worker -> cli.HermesCLI) to serve the
      # interactive TUI's slash menu -- tens of MB of RSS per conversation,
      # never evicted when a browser tab closes. The web chat does not use
      # the slash menu, so the Dockerfile-patched tui_gateway leaves the
      # worker unspawned when this is set.
      - key: HERMES_TUI_DISABLE_SLASH_WORKER
        value: "1"
      # tui_gateway's long-RPC thread pool defaults to 4 workers; two is
      # enough for one dashboard user on the small instance.
      - key: HERMES_TUI_RPC_POOL_WORKERS
        value: "2"
      # Finalize in-process chat sessions when the browser's WebSocket
      # drops instead of holding full AIAgent objects for the dashboard's
      # whole lifetime; transcripts persist and re-open via session.resume.
      - key: HERMES_TUI_CLOSE_SESSIONS_ON_DISCONNECT
        value: "1"
      # Hard cap on live in-process chat sessions (the Dockerfile-patched
      # tui_gateway registry). Nothing upstream bounds the registry, so a
      # browser tab that vanishes without a clean close leaves its agent
      # pinned in the dashboard for the life of the container and the growth
      # is linear in the number of them. Measured over 24 abandoned tabs in a
      # 512 MB cgroup: 0.20 MB per conversation capped, 0.97 MB uncapped, and
      # only the capped curve plateaus. Over the cap the oldest sessions are
      # finalized and dropped -- transcript first, so they re-open via
      # session.resume -- and a session mid-turn is skipped rather than torn
      # down. 2 is what one user on 512 MB can actually afford; 0 disables.
      - key: HERMES_TUI_MAX_SESSIONS
        value: "2"

      # Keep native runtimes from multiplying worker threads or retaining
      # large allocator arenas on the small Free instance.
      - key: NODE_OPTIONS
        value: --max-old-space-size=96
      - key: MALLOC_ARENA_MAX
        value: "2"
      # glibc's malloc grows its trim threshold dynamically (up to 32 MB) when
      # it sees a lot of freeing, which means freed memory is held instead of
      # returned to the OS -- invisible to Python's gc and fatal in a container
      # whose ceiling is 512 MB. Pinning the threshold keeps the allocator
      # handing pages back. Verified as part of the bench run rather than
      # assumed: see tools/bench.
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: MAKEFLAGS
        value: -j1
      # Bound the pinned gateway's cached per-session agent objects. These
      # values are read by the small Dockerfile source patch at process import.
      # Free's 512MB container kept OOM-restarting with the previous 4-agent
      # cache, so the baseline here is 2 agents evicted after 2min idle. A
      # single web/Telegram chat is served fine at this; raise both on a paid
      # instance that can hold more concurrent sessions.
      - key: HERMES_AGENT_CACHE_MAX_SIZE
        value: "2"
      - key: HERMES_AGENT_CACHE_IDLE_TTL_SECONDS
        value: "120"

      # Proactive OOM guard (memory_guard_loop in bootstrap.sh). On a cgroup
      # cap at or under HERMES_MEMGUARD_MAX_ACTIVE_MB it polls memory every few
      # seconds and reclaims BEFORE the kernel OOM-kills the container:
      # telemetry at WARN%, SIGSTOP the git state-sync daemon at PAUSE_SYNC%
      # (resuming once usage falls to RESUME_SYNC%), and as an emergency last
      # resort it drops the dashboard (which holds the web-chat agents) at
      # DASHBOARD_PCT% -- confirmed across 3 consecutive samples and
      # rate-limited -- so the watchdog restarts it. Dropping the dashboard is
      # far cheaper than letting the kernel OOM-kill the whole container (a
      # full 1-2min restore+boot). Set HERMES_MEMGUARD_DASHBOARD_PCT=0 to
      # disable that stage if you prefer never to recycle the dashboard.
      - key: HERMES_MEMGUARD
        value: "1"
      - key: HERMES_MEMGUARD_INTERVAL_SECONDS
        value: "3"
      - key: HERMES_MEMGUARD_WARN
        value: "70"
      - key: HERMES_MEMGUARD_PAUSE_SYNC
        value: "80"
      - key: HERMES_MEMGUARD_RESUME_SYNC
        value: "62"
      # Staged degradation. WATCH (>= WARN) only reports. HIGH (>= PAUSE_SYNC)
      # SIGSTOPs the sync daemon and reaps orphaned slash workers. CRITICAL
      # (>= this) stops the sync daemon for good and holds its supervisor off,
      # because a paused daemon still holds its RSS. EMERGENCY
      # (>= DASHBOARD_PCT) recycles the dashboard -- SIGTERM first so sessions
      # finalize, then SIGKILL -- and never the gateway, whose oom_score_adj
      # bootstrap lowers so the kernel does not take it first either. Any
      # stage set to 0 is off.
      - key: HERMES_MEMGUARD_CRITICAL
        value: "87"
      - key: HERMES_MEMGUARD_DASHBOARD_PCT
        value: "92"
      # Git state-sync memory. git eagerly mallocs http.postBuffer on every
      # push and pack-objects defaults to unbounded delta windows with one
      # thread per core; the shipped defaults can spike one push far past
      # 512 MB (and the OOM killer then takes the gateway as readily as the
      # sync worker). Keep the request unchunked (GitHub 408s on chunked
      # receive-packs) but small, and cap pack memory.
      - key: GIT_STATE_HTTP_POST_BUFFER_MB
        value: "64"
      - key: GIT_STATE_PACK_WINDOW_MEMORY_MB
        value: "16"
      - key: GIT_STATE_PACK_THREADS
        value: "1"

      # Generated once at first deploy. Reuse this value as API_SERVER_KEY
      # in the Render Environment tab if you later opt into the
      # OpenAI-compatible API server (API_SERVER_ENABLED=true).
      - key: HERMES_GATEWAY_TOKEN
        generateValue: true

      # Bearer token for the pre-registered Render MCP server. Generate
      # at https://dashboard.render.com/u/*/settings#api-keys and paste
      # into the dashboard's Environment tab. The boot-time patcher
      # reads ${RENDER_MCP_API_KEY} into config.yaml lazily, so you can
      # rotate by editing the env var and restarting — no rebuild needed.
      #
      # Named `RENDER_MCP_API_KEY` rather than the stock `RENDER_API_KEY`
      # to avoid accidental auto-auth if someone later installs the
      # `render` CLI. This is the same kind of Render API key; the Render
      # account role behind the key determines what the agent can do.
      - key: RENDER_MCP_API_KEY
        sync: false

      # Seconds the Render MCP client waits for its initial connection.
      # Upstream's default is 60, and tui_gateway/entry.py calls
      # discover_mcp_tools() SYNCHRONOUSLY before emitting `gateway.ready` --
      # the event the browser Chat tab waits on. Measured against an
      # unreachable server: discover_mcp_tools() blocked 60.05 s at the
      # default and 5.03 s with a 5 s bound, returning [] either way. So a
      # slow or unreachable mcp.render.com at boot leaves the dashboard's chat
      # unusable for the whole timeout. 10 s is generous for a healthy TLS +
      # MCP initialize (a TLS round trip to GitHub measured 0.55-0.61 s wall
      # on this 0.1 CPU budget) and caps the worst case at a sixth of
      # upstream's. This bounds how long boot waits; it does NOT disable the
      # server -- the tools still register once it answers, and discovery
      # retries on its next call.
      - key: HERMES_RENDER_MCP_CONNECT_TIMEOUT
        value: "10"

      # Private age key that decrypts env/secrets.enc.env at boot. Paste the
      # AGE-SECRET-KEY-... line produced by `./run-local.sh secrets init`.
      # This single value replaces pasting every API key into this tab: the
      # rest travel with the repo, encrypted. Leave it blank to ignore the
      # committed secrets and configure everything from this tab instead.
      #
      # A Render Secret File mounted at /etc/secrets/age.key works too, and
      # bootstrap.sh picks it up automatically.
      - key: SOPS_AGE_KEY
        sync: false
