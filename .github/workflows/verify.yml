name: Hermes Render 512 MB
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml cryptography fastapi httpx websockets
      - run: python -m unittest discover -s tests -q
      - run: node --check dashboard-plugins/hermes-chat-dashboard/dashboard/bundle/index.js
      - run: docker build -t hermes-lite .
      - name: Boot native dashboard under 512 MB without swap
        run: |
          docker run -d --name hermes-lite --memory=512m --memory-swap=512m -p 10000:10000 -e HERMES_GATEWAY_TOKEN=ci-only-password hermes-lite
          docker cp tests/chat_probe_server.py hermes-lite:/tmp/chat_probe_server.py
          docker exec -d hermes-lite /opt/hermes/.venv/bin/python /tmp/chat_probe_server.py
          docker cp tests/combined_load_probe.py hermes-lite:/tmp/combined_load_probe.py
          docker exec -d -u hermes -w /opt/hermes hermes-lite /opt/hermes/.venv/bin/python /opt/render-tools/agent-budget.py run gateway /opt/hermes/.venv/bin/python /tmp/combined_load_probe.py gateway
          docker exec -d -e STORAGE_ENCRYPTION_KEY=ci-only-key -u hermes -w /opt/hermes hermes-lite /opt/hermes/.venv/bin/python /tmp/combined_load_probe.py storage
          python tests/container_smoke.py
      - name: Verify native gateway starts without artificial allocation caps
        run: |
          docker exec -u hermes -w /opt/hermes hermes-lite /opt/hermes/.venv/bin/python /opt/render-tools/agent-budget.py run gateway /opt/hermes/.venv/bin/python -c 'import resource; before=resource.getrlimit(resource.RLIMIT_DATA); from gateway.run import GatewayRunner; runner=GatewayRunner(); assert resource.getrlimit(resource.RLIMIT_DATA)==before; print("Native gateway starts without artificial allocation caps")'
      - name: Verify repeated PTY process-tree cleanup
        run: |
          docker cp tests/pty_cleanup_probe.py hermes-lite:/tmp/pty_cleanup_probe.py
          docker exec -w /opt/hermes hermes-lite /opt/hermes/.venv/bin/python /tmp/pty_cleanup_probe.py
      - name: Verify durable native gateway recovery
        run: |
          docker cp tests/native_recovery_probe.py hermes-lite:/tmp/native_recovery_probe.py
          docker exec -u hermes -w /opt/hermes hermes-lite /opt/hermes/.venv/bin/python /tmp/native_recovery_probe.py
      - name: Container diagnostics
        if: always()
        run: |
          docker logs hermes-lite 2>&1 | tail -100 || true
          docker inspect hermes-lite --format '{{json .State}}' || true
