name: Hermes Render 512 MB
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml cryptography fastapi httpx websockets
      - run: python -m unittest discover -s tests -q
      - run: docker build -t hermes-lite .
      - name: Boot native dashboard under 512 MB without swap
        run: |
          docker run -d --name hermes-lite --memory=512m --memory-swap=512m -p 10000:10000 -e HERMES_GATEWAY_TOKEN=ci-only-password -e STORAGE_ENCRYPTION_KEY=ci-only-key hermes-lite
          python tests/container_smoke.py
      - name: Verify native gateway starts with Python allocation cap
        run: |
          docker exec -u hermes -w /opt/hermes hermes-lite /opt/hermes/.venv/bin/python /opt/render-tools/agent-budget.py run gateway /opt/hermes/.venv/bin/python -c 'from gateway.run import GatewayRunner; import resource; runner=GatewayRunner(); assert resource.getrlimit(resource.RLIMIT_DATA)==(192*1048576,192*1048576); print("Native gateway constructed under 192 MiB allocation cap")'
      - name: Verify repeated PTY process-tree cleanup
        run: |
          docker cp tests/pty_cleanup_probe.py hermes-lite:/tmp/pty_cleanup_probe.py
          docker exec -w /opt/hermes hermes-lite /opt/hermes/.venv/bin/python /tmp/pty_cleanup_probe.py
      - name: Container diagnostics
        if: always()
        run: |
          docker logs hermes-lite 2>&1 | tail -100 || true
          docker inspect hermes-lite --format '{{json .State}}' || true
